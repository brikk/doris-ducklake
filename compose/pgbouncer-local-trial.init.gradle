// Owner-authorized LOCAL 0.16 trial only. Do not change the normal 0.15.1 pin or publish/promote this lane.
import groovy.json.JsonOutput
import java.security.MessageDigest
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.tasks.testing.Test

def projectRoot = new File(System.getenv('DORIS_PGBOUNCER_TRIAL_PROJECT') ?: new File('.').absolutePath).canonicalFile
def output = new File(projectRoot, 'build/pgbouncer-local-trial')
def modules = ['ducklake-catalog', 'ducklake-test-corpus-replay', 'slt-format'] as Set
def expected = [
    'ducklake-catalog-0.16.0-SNAPSHOT.jar': '4b9659ef1100a8350b1d09b353e65448e26cdab2cc85c85b6f5d800848c6e234',
    'ducklake-catalog-0.16.0-SNAPSHOT-test-fixtures.jar': 'ca33bee56b33703ea7bbe7b76153bbaccc0275478fc992d48768eb912a1a056f',
    'ducklake-test-corpus-replay-0.16.0-SNAPSHOT.jar': '3b3ddd334e9eb9cd971062cc2b19b1b2d7ee535538c46f005b5db01277300c11',
    'slt-format-0.16.0-SNAPSHOT.jar': 'ee37d13d863437eaaf36fe4c34f8d66cfa1cb6d1349ef661ae4f50d2e91120be',
]
gradle.beforeProject { p ->
    if (p.projectDir.canonicalFile != projectRoot) return
    p.layout.buildDirectory.set(output)
    p.repositories.exclusiveContent {
        forRepository {
            p.repositories.mavenLocal {
                name = 'ownerPgbouncerLocalTrial'
                assert new File(url).canonicalFile == new File(System.getProperty('user.home'), '.m2/repository').canonicalFile:
                    'This exception is for the owner-installed ~/.m2 snapshot only'
                metadataSources { gradleMetadata(); mavenPom() }
            }
        }
        filter { modules.each { includeModule('dev.brikk.ducklake', it) } }
    }
    p.configurations.configureEach {
        resolutionStrategy.eachDependency {
            if (requested.group == 'dev.brikk.ducklake' && requested.name in modules) useVersion('0.16.0-SNAPSHOT')
        }
    }
}
gradle.projectsEvaluated {
    def p = rootProject
    if (p.projectDir.canonicalFile != projectRoot) return
    assert p.findProperty('catalogReadCorrectnessCandidate') != 'true': 'Do not mix the historical reader and local trial'
    p.extensions.getByName('kotlin').sourceSets.named('test') { kotlin.srcDir('test/pgbouncer-trial') }
    // Already a catalog runtime dependency; expose its getter API only to the isolated smoke's compiler.
    p.dependencies.add('testCompileOnly', 'com.zaxxer:HikariCP:7.0.2')
    p.extensions.getByName('detekt').source.from(p.file('test/pgbouncer-trial'))
    def verify = p.tasks.register('verifyPgbouncerLocalTrial') {
        doLast {
            def identities = [:]
            ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
                identities[name] = p.configurations.getByName(name).incoming.artifacts.artifacts.findAll {
                    def id = it.id.componentIdentifier
                    id instanceof ModuleComponentIdentifier && id.group == 'dev.brikk.ducklake' && id.module in modules
                }.collect { artifact ->
                    def id = artifact.id.componentIdentifier
                    assert id.version == '0.16.0-SNAPSHOT': "Mixed trial component: ${id}"
                    def hash = MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()
                    assert expected[artifact.file.name] == hash: "Owner local JAR changed: ${artifact.file.name} ${hash}"
                    [component: id.displayName, file: artifact.file.name, sha256: hash, path: artifact.file.canonicalPath]
                }.sort { it.file }
            }
            assert (identities.testRuntimeClasspath*.file as Set) == expected.keySet(): 'Missing local trial variants'
            def receipt = new File(output, 'reports/pgbouncer-local-trial-identity.json')
            receipt.parentFile.mkdirs()
            receipt.text = JsonOutput.prettyPrint(JsonOutput.toJson(identities)) + '\n'
            println 'Verified owner-local 0.16.0-SNAPSHOT: four exact hashes; normal pin remains 0.15.1'
        }
    }
    p.tasks.withType(Test).configureEach { dependsOn(verify); maxParallelForks = 1; maxHeapSize = '512m' }
    p.tasks.named('test', Test) { filter { setIncludePatterns('*DuckLakePoolConfigurationTest') } }
    p.tasks.named('java17PluginTest', Test) {
        filter { setIncludePatterns('*DuckLakePoolConfigurationTest', '*DuckLakePgBouncerLocalTrialTest') }
    }
}
